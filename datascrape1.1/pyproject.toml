[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datascrape"
version = "1.0.0"
description = "Universal multi-VCS concurrent audit, security, observability, and API scraping CLI"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.scripts]
datascrape = "datascrape.cli:main"